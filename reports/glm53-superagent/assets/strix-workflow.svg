<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="strix-title strix-desc">
<title id="strix-title">SecurityScan · Strix 工作流程</title><desc id="strix-desc">本项目集成方式 · 模型推理与 Docker 工具执行分工</desc>
<defs><marker id="strix-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#546578"/></marker></defs>
<rect width="1400" height="880" fill="white"/>
<rect width="1400" height="100" fill="#232f3e"/>
<path d="M32 78 H1368" stroke="#ff9900" stroke-width="3"/>
<style>text{font-family:'Noto Sans CJK SC',Arial,'Microsoft YaHei',sans-serif;fill:#232f3e} .title{font-size:27px;font-weight:700;fill:white} .sub{font-size:15px;fill:#d5dbdb} .label{font-size:16px;font-weight:700} .detail{font-size:14px;fill:#526273} .edge{font-size:13px;fill:#35485d}</style>
<text x="32" y="39" class="title">SecurityScan · Strix 工作流程</text>
<text x="32" y="65" class="sub">本项目集成方式 · 模型推理与 Docker 工具执行分工</text>
<rect x="40" y="135" width="350" height="104" rx="3" fill="#fafbfc" stroke="#d5dbdb"/><rect x="40" y="135" width="5" height="104" fill="#8c4fff"/><rect x="54" y="150" width="38" height="38" fill="#8c4fff"/>
<g transform="translate(54 150)" fill="none" stroke="white" stroke-width="1.5"><path d="M7 11h24M7 19h24M7 27h24M12 7v8m14 0v8m-14 0v8"/></g>
<text x="104" y="167" class="label">1. 用户提交目标</text>
<text x="56" y="205" class="detail">GitHub 仓库 / Web / API</text>
<text x="56" y="224" class="detail">登录后选择目标和扫描模式</text>
<rect x="525" y="135" width="350" height="104" rx="3" fill="#fafbfc" stroke="#d5dbdb"/><rect x="525" y="135" width="5" height="104" fill="#c925d1"/><rect x="539" y="150" width="38" height="38" fill="#c925d1"/>
<g transform="translate(539 150)" fill="none" stroke="white" stroke-width="1.5"><rect x="7" y="8" width="24" height="23"/><path d="M12 14h14m-14 5h14m-14 5h14"/></g>
<text x="589" y="167" class="label">2. API 校验与入队</text>
<text x="541" y="205" class="detail">校验登录身份和授权目标</text>
<text x="541" y="224" class="detail">DynamoDB 记录任务 · SQS 排队</text>
<rect x="1010" y="135" width="350" height="104" rx="3" fill="#fafbfc" stroke="#d5dbdb"/><rect x="1010" y="135" width="5" height="104" fill="#ed7100"/><rect x="1024" y="150" width="38" height="38" fill="#ed7100"/>
<g transform="translate(1024 150)" fill="none" stroke="white" stroke-width="1.5"><rect x="10" y="10" width="18" height="18"/><path d="M6 13h4m-4 6h4m-4 6h4m18-12h4m-4 6h4m-4 6h4M13 6v4m6-4v4m6-4v4m-12 18v4m6-4v4m6-4v4"/></g>
<text x="1074" y="167" class="label">3. ECS Worker</text>
<text x="1026" y="205" class="detail">领取任务并启动 Strix</text>
<text x="1026" y="224" class="detail">等待模型就绪 · 保存执行状态</text>
<polyline points="390,187 525,187" fill="none" stroke="#546578" stroke-width="1.6" marker-end="url(#strix-arrow)" />
<text x="442" y="174" class="edge">提交</text>
<polyline points="875,187 1010,187" fill="none" stroke="#546578" stroke-width="1.6" marker-end="url(#strix-arrow)" />
<text x="906" y="174" class="edge">消费队列</text>
<rect x="40" y="300" width="835" height="365" fill="none" stroke="#ed7100" stroke-width="1.5" />
<text x="56" y="325" class="label">Worker EC2 主机 · m7i.xlarge</text>
<rect x="75" y="380" width="340" height="104" rx="3" fill="#fafbfc" stroke="#d5dbdb"/><rect x="75" y="380" width="5" height="104" fill="#ed7100"/><rect x="89" y="395" width="38" height="38" fill="#ed7100"/>
<g transform="translate(89 395)" fill="none" stroke="white" stroke-width="1.5"><rect x="10" y="10" width="18" height="18"/><path d="M6 13h4m-4 6h4m-4 6h4m18-12h4m-4 6h4m-4 6h4M13 6v4m6-4v4m6-4v4m-12 18v4m6-4v4m6-4v4"/></g>
<text x="139" y="412" class="label">Strix Agent · Worker 容器</text>
<text x="91" y="450" class="detail">规划检查 → 分析证据 → 决定下一步</text>
<text x="91" y="469" class="detail">循环调用模型与工具</text>
<rect x="490" y="380" width="350" height="104" rx="3" fill="#fafbfc" stroke="#d5dbdb"/><rect x="490" y="380" width="5" height="104" fill="#8c4fff"/><rect x="504" y="395" width="38" height="38" fill="#8c4fff"/>
<g transform="translate(504 395)" fill="none" stroke="white" stroke-width="1.5"><rect x="10" y="10" width="18" height="18"/><path d="M6 13h4m-4 6h4m-4 6h4m18-12h4m-4 6h4m-4 6h4M13 6v4m6-4v4m6-4v4m-12 18v4m6-4v4m6-4v4"/></g>
<text x="554" y="412" class="label">Docker 工具沙箱</text>
<text x="506" y="450" class="detail">执行命令、脚本、源码与 HTTP 检查</text>
<text x="506" y="469" class="detail">通过宿主机 Docker daemon 创建</text>
<polyline points="415,422 490,422" fill="none" stroke="#546578" stroke-width="1.6" marker-end="url(#strix-arrow)" />
<text x="420" y="405" class="edge">调用工具</text>
<polyline points="665,484 665,535 245,535 245,484" fill="none" stroke="#546578" stroke-width="1.6" marker-end="url(#strix-arrow)" />
<text x="380" y="560" class="edge">工具结果返回 Agent</text>
<text x="75" y="612" class="detail">两个独立容器共享宿主机内核；沙箱不是独立虚拟机。</text>
<rect x="1010" y="380" width="350" height="104" rx="3" fill="#fafbfc" stroke="#d5dbdb"/><rect x="1010" y="380" width="5" height="104" fill="#ed7100"/><rect x="1024" y="395" width="38" height="38" fill="#ed7100"/>
<g transform="translate(1024 395)" fill="none" stroke="white" stroke-width="1.5"><rect x="10" y="10" width="18" height="18"/><path d="M6 13h4m-4 6h4m-4 6h4m18-12h4m-4 6h4m-4 6h4M13 6v4m6-4v4m6-4v4m-12 18v4m6-4v4m6-4v4"/></g>
<text x="1074" y="412" class="label">GPU EC2 · GLM-5.3</text>
<text x="1026" y="450" class="detail">SGLang 提供模型推理</text>
<text x="1026" y="469" class="detail">分析上下文并生成工具调用或结论</text>
<polyline points="1185,239 1185,280 245,280 245,380" fill="none" stroke="#546578" stroke-width="1.6" marker-end="url(#strix-arrow)" />
<text x="690" y="270" class="edge">启动 Agent</text>
<polyline points="415,390 455,390 455,335 960,335 960,432 1010,432" fill="none" stroke="#546578" stroke-width="1.6" marker-end="url(#strix-arrow)" />
<text x="720" y="325" class="edge">私网模型请求</text>
<polyline points="1010,465 945,465 945,590 415,590 415,484" fill="none" stroke="#546578" stroke-width="1.6" marker-end="url(#strix-arrow)" />
<text x="880" y="578" class="edge">模型响应</text>
<rect x="1010" y="710" width="350" height="104" rx="3" fill="#fafbfc" stroke="#d5dbdb"/><rect x="1010" y="710" width="5" height="104" fill="#3f8624"/><rect x="1024" y="725" width="38" height="38" fill="#3f8624"/>
<g transform="translate(1024 725)" fill="none" stroke="white" stroke-width="1.5"><ellipse cx="19" cy="11" rx="11" ry="4"/><path d="M8 11v17c0 6 22 6 22 0V11M8 19c0 6 22 6 22 0"/></g>
<text x="1074" y="742" class="label">4. 保存报告与历史</text>
<text x="1026" y="780" class="detail">S3 保存扫描产物 · DynamoDB 状态</text>
<text x="1026" y="799" class="detail">前端查看记录与下载报告</text>
<polyline points="245,484 245,760 1010,760" fill="none" stroke="#546578" stroke-width="1.6" marker-end="url(#strix-arrow)" />
<text x="650" y="747" class="edge">扫描结束 · 收集报告</text>
<text x="40" y="835" class="detail">发现需复核；完整扫描耗时包含模型推理、工具执行和编排。独立流式基准用于测量 TTFT / E2E。</text>
</svg>
